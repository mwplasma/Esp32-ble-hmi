<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>JH ESP32 BLE HMI</title>
</head>

<body>

  <h1>JH ESP32 BLE HMI</h1>

  <button id="connectButton">CONNECT BLE</button>

  <p id="status">Status: DISCONNECTED</p>

  <button id="onButton" disabled>LED ON</button>
  <button id="offButton" disabled>LED OFF</button>

  <br><br>

  <label for="brightness">
    Brightness: <span id="brightnessValue">0</span>%
  </label>

  <br>

  <input
    type="range"
    id="brightness"
    min="0"
    max="100"
    value="0"
    disabled
  >

<script>

const SERVICE_UUID =
  "12345678-1234-1234-1234-1234567890ab";

const CHARACTERISTIC_UUID =
  "abcd1234-5678-1234-5678-abcdef123456";

let characteristic;

document.getElementById("connectButton").addEventListener("click", async () => {

  try {

    const device = await navigator.bluetooth.requestDevice({
      filters: [{ name: "JH_ESP32_BLE" }],
      optionalServices: [SERVICE_UUID]
    });

    const server = await device.gatt.connect();

    const service =
      await server.getPrimaryService(SERVICE_UUID);

    characteristic =
      await service.getCharacteristic(CHARACTERISTIC_UUID);

    document.getElementById("status").innerText =
      "Status: CONNECTED";

    document.getElementById("onButton").disabled = false;
    document.getElementById("offButton").disabled = false;
    document.getElementById("brightness").disabled = false;

  }

  catch (error) {

    document.getElementById("status").innerText =
      "Status: ERROR";

    console.log(error);

  }

});


async function sendCommand(command) {

  if (!characteristic) return;

  const data = new TextEncoder().encode(command);

  await characteristic.writeValue(data);

}


document.getElementById("onButton").addEventListener("click", async () => {

  await sendCommand("ON");

});


document.getElementById("offButton").addEventListener("click", async () => {

  await sendCommand("OFF");

});


document.getElementById("brightness").addEventListener("input", async (event) => {

  const value = event.target.value;

  document.getElementById("brightnessValue").innerText = value;

  await sendCommand(value);

});

</script>

</body>
</html>
