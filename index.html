<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JH ESP32 BLE HMI</title>
</head>

<body>

  <h1>JH ESP32 BLE HMI</h1>

  <button id="connectButton">CONNECT BLE</button>

  <p id="status">Status: DISCONNECTED</p>

  <button id="onButton" disabled>LED ON</button>
  <button id="offButton" disabled>LED OFF</button>

  <br><br>

  <label for="brightness">
    Brightness: <span id="brightnessValue">0</span>%
  </label>

  <br>

  <input
    type="range"
    id="brightness"
    min="0"
    max="100"
    value="0"
    disabled
  >

<script>

const SERVICE_UUID =
  "12345678-1234-1234-1234-1234567890ab";

const CHARACTERISTIC_UUID =
  "abcd1234-5678-1234-5678-abcdef123456";

let bluetoothDevice = null;
let characteristic = null;


// ----------------------------
// Control enable / disable
// ----------------------------

function setControls(enabled) {

  document.getElementById("onButton").disabled = !enabled;
  document.getElementById("offButton").disabled = !enabled;
  document.getElementById("brightness").disabled = !enabled;

}


// ----------------------------
// CONNECT / DISCONNECT button
// ----------------------------

document.getElementById("connectButton").addEventListener(
  "click",
  async () => {

    // Already connected -> DISCONNECT
    if (
      bluetoothDevice &&
      bluetoothDevice.gatt.connected
    ) {

      bluetoothDevice.gatt.disconnect();

      return;
    }


    // Not connected -> CONNECT
    try {

      bluetoothDevice =
        await navigator.bluetooth.requestDevice({
          filters: [
            { name: "JH_ESP32_BLE" }
          ],
          optionalServices: [
            SERVICE_UUID
          ]
        });


      bluetoothDevice.addEventListener(
        "gattserverdisconnected",
        onDisconnected
      );


      const server =
        await bluetoothDevice.gatt.connect();


      const service =
        await server.getPrimaryService(
          SERVICE_UUID
        );


      characteristic =
        await service.getCharacteristic(
          CHARACTERISTIC_UUID
        );


      document.getElementById("status").innerText =
        "Status: CONNECTED";


      document.getElementById("connectButton").innerText =
        "DISCONNECT";


      setControls(true);

    }

    catch (error) {

      document.getElementById("status").innerText =
        "Status: ERROR";

      document.getElementById("connectButton").innerText =
        "CONNECT BLE";

      setControls(false);

      console.log(error);

    }

  }
);


// ----------------------------
// BLE disconnected
// ----------------------------

function onDisconnected() {

  characteristic = null;

  document.getElementById("status").innerText =
    "Status: DISCONNECTED";


  document.getElementById("connectButton").innerText =
    "CONNECT BLE";


  setControls(false);

}


// ----------------------------
// Send command to ESP32
// ----------------------------

async function sendCommand(command) {

  if (
    !characteristic ||
    !bluetoothDevice ||
    !bluetoothDevice.gatt.connected
  ) {

    return;

  }

  const data =
    new TextEncoder().encode(command);

  await characteristic.writeValue(data);

}


// ----------------------------
// LED ON
// ----------------------------

document.getElementById("onButton").addEventListener(
  "click",
  async () => {

    await sendCommand("ON");

  }
);


// ----------------------------
// LED OFF
// ----------------------------

document.getElementById("offButton").addEventListener(
  "click",
  async () => {

    await sendCommand("OFF");

  }
);


// ----------------------------
// PWM
// ----------------------------

document.getElementById("brightness").addEventListener(
  "input",
  async (event) => {

    const value = event.target.value;


    document.getElementById(
      "brightnessValue"
    ).innerText = value;


    await sendCommand(value);

  }
);

</script>

</body>
</html>
