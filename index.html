<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Project Rebirth - ESP32 BLE HMI</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px;
      background: #111827;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 520px;
      margin: auto;
      background: #1f2937;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 4px;
      font-size: 28px;
      color: #38bdf8;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 25px;
      font-size: 18px;
      font-weight: normal;
      color: #cbd5e1;
    }

    .statusPanel {
      background: #0f172a;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 22px;
      text-align: left;
    }

    .statusLine {
      margin: 8px 0;
      font-size: 18px;
      font-weight: bold;
    }

    .dot {
      display: inline-block;
      width: 13px;
      height: 13px;
      margin-right: 8px;
      border-radius: 50%;
      background: #ef4444;
    }

    #ledDot {
      background: #ef4444;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 15px 22px;
      margin: 7px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      color: white;
    }

    button:disabled {
      opacity: 0.35;
      cursor: default;
    }

    #connectButton {
      width: 90%;
      background: #2563eb;
      margin-bottom: 20px;
    }

    #onButton {
      background: #16a34a;
      width: 42%;
    }

    #offButton {
      background: #dc2626;
      width: 42%;
    }

    .brightnessPanel {
      margin-top: 25px;
      padding: 20px;
      background: #0f172a;
      border-radius: 12px;
    }

    .brightnessTitle {
      font-size: 16px;
      color: #94a3b8;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    #brightnessValue {
      font-size: 32px;
      font-weight: bold;
      color: #38bdf8;
    }

    #brightness {
      width: 90%;
      margin-top: 18px;
      accent-color: #38bdf8;
    }

    #resetButton {
      margin-top: 25px;
      width: 55%;
      background: #64748b;
    }

    footer {
      margin-top: 30px;
      color: #64748b;
      font-size: 13px;
    }

  </style>
</head>


<body>

<div class="container">

  <h1>PROJECT REBIRTH</h1>

  <h2>ESP32 BLE HMI</h2>


  <button id="connectButton">
    CONNECT BLE
  </button>


  <div class="statusPanel">

    <div class="statusLine">

      <span id="systemDot"
            class="dot"></span>

      SYSTEM:
      <span id="systemStatus">
        DISCONNECTED
      </span>

    </div>


    <div class="statusLine">

      <span id="ledDot"
            class="dot"></span>

      LED STATUS:
      <span id="ledStatus">
        OFF
      </span>

    </div>

  </div>


  <button id="onButton" disabled>
    LED ON
  </button>

  <button id="offButton" disabled>
    LED OFF
  </button>


  <div class="brightnessPanel">

    <div class="brightnessTitle">
      BRIGHTNESS
    </div>

    <div>
      <span id="brightnessValue">0</span>%
    </div>

    <input
      type="range"
      id="brightness"
      min="0"
      max="100"
      value="0"
      disabled
    >

  </div>


  <button id="resetButton" disabled>
    RESET
  </button>


  <footer>
    PROJECT REBIRTH | ESP32 BLE HMI v1.0
  </footer>

</div>


<script>

const SERVICE_UUID =
  "12345678-1234-1234-1234-1234567890ab";

const CHARACTERISTIC_UUID =
  "abcd1234-5678-1234-5678-abcdef123456";


let bluetoothDevice = null;
let characteristic = null;


// =============================================
// Enable / Disable controls
// =============================================

function setControls(enabled) {

  document.getElementById("onButton").disabled =
    !enabled;

  document.getElementById("offButton").disabled =
    !enabled;

  document.getElementById("brightness").disabled =
    !enabled;

  document.getElementById("resetButton").disabled =
    !enabled;
}


// =============================================
// System Status
// =============================================

function setSystemStatus(connected) {

  const status =
    document.getElementById("systemStatus");

  const dot =
    document.getElementById("systemDot");


  if (connected) {

    status.innerText = "CONNECTED";
    status.style.color = "#22c55e";

    dot.style.background = "#22c55e";

  }

  else {

    status.innerText = "DISCONNECTED";
    status.style.color = "#ef4444";

    dot.style.background = "#ef4444";

  }
}


// =============================================
// LED Status
// =============================================

function updateLedStatus(value) {

  const status =
    document.getElementById("ledStatus");

  const dot =
    document.getElementById("ledDot");

  const brightnessValue =
    document.getElementById("brightnessValue");


  brightnessValue.innerText = value;


  if (value == 0) {

    status.innerText = "OFF";
    status.style.color = "#ef4444";

    dot.style.background = "#ef4444";

  }

  else if (value == 100) {

    status.innerText = "ON";
    status.style.color = "#22c55e";

    dot.style.background = "#22c55e";

  }

  else {

    status.innerText = "DIMMING";
    status.style.color = "#facc15";

    dot.style.background = "#facc15";

  }
}


// =============================================
//
