<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Project Rebirth</title>

<style>

body {
    margin: 0;
    background: #10151c;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 25px;
}

h1 {
    margin-bottom: 5px;
    color: #5fc9ff;
}

.owner {
    color: #aaaaaa;
    margin-bottom: 25px;
}

button {
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 22px;
    font-weight: bold;
    padding: 20px;
    margin: 8px;
    cursor: pointer;
}

.connect {
    width: 260px;
    background: #1976d2;
}

.jog {
    width: 220px;
    height: 90px;
    background: #167c45;
}

.stop {
    width: 220px;
    height: 80px;
    background: #c62828;
}
.reset {
    width: 220px;
    height: 65px;
    background: #6a5acd;
    font-size: 20px;
}
.speedButton {
    width: 100px;
    height: 80px;
    background: #455a64;
    font-size: 36px;
}

.speedDisplay {
    display: inline-block;
    width: 160px;
    font-size: 32px;
    font-weight: bold;
}

.speedTitle {
    margin-top: 30px;
    font-size: 20px;
    color: #aaaaaa;
}

.status {
    margin-top: 30px;
    padding: 15px;
    font-weight: bold;
    font-size: 18px;
    color: #ff5252;
}

.connected {
    color: #5cff8d;
}

</style>
</head>

<body>

<div class="container">

<h1>PROJECT REBIRTH</h1>

<div class="owner">
Jeong Hoon Kim (김정훈)
</div>

<button class="connect"
        onclick="connectBLE()">
CONNECT
</button>

<br><br>

<button class="jog"
        onclick="sendCommand('R')">
JOG REV
</button>

<button class="jog"
        onclick="sendCommand('F')">
JOG FWD
</button>

<br>

<button class="stop"
        onclick="sendCommand('S')">
STOP
</button>
<br>

<button class="reset"
        onclick="resetSpeed()">
RESET SPEED
</button>
      
<div class="speedTitle">
JOG SPEED
</div>

<div>

<button class="speedButton"
        onclick="decreaseSpeed()">
−
</button>

<span id="speed"
      class="speedDisplay">
10 mm/s
</span>

<button class="speedButton"
        onclick="increaseSpeed()">
+
</button>

</div>

<div id="status"
     class="status">
BLE: DISCONNECTED
</div>

</div>


<script>

// ========================================
// BLE variables
// ========================================

let bluetoothDevice = null;
let characteristic = null;


// ========================================
// JOG speed settings
// ========================================

let speed = 10;

const MIN_SPEED = 5;
const MAX_SPEED = 50;
const SPEED_STEP = 5;


// ========================================
// BLE UUID
// ========================================

const SERVICE_UUID =
"12345678-1234-1234-1234-123456789abc";

const CHARACTERISTIC_UUID =
"abcd1234-1234-1234-1234-abcdef123456";


// ========================================
// BLE CONNECT
// ========================================

async function connectBLE()
{
    try
    {
        document.getElementById("status").innerHTML =
            "BLE: CONNECTING...";

        bluetoothDevice =
            await navigator.bluetooth.requestDevice(
            {
                filters:
                [
                    {
                        name: "Project_Rebirth"
                    }
                ],

                optionalServices:
                [
                    SERVICE_UUID
                ]
            });

        const server =
            await bluetoothDevice.gatt.connect();

        const service =
            await server.getPrimaryService(
                SERVICE_UUID
            );

        characteristic =
            await service.getCharacteristic(
                CHARACTERISTIC_UUID
            );

        document.getElementById("status").innerHTML =
            "BLE: CONNECTED";

        document.getElementById("status")
                .classList.add("connected");

        await sendCommand("V" + speed);
    }

    catch(error)
    {
        console.log(error);

        document.getElementById("status").innerHTML =
            "BLE: CONNECTION FAILED";

        document.getElementById("status")
                .classList.remove("connected");
    }
}


// ========================================
// SEND BLE COMMAND
// ========================================

async function sendCommand(command)
{
    if (!characteristic)
    {
        alert("BLE is not connected.");
        return;
    }

    try
    {
        const encoder =
            new TextEncoder();

        await characteristic.writeValue(
            encoder.encode(command)
        );

        console.log("Sent:", command);
    }

    catch(error)
    {
        console.log(error);
    }
}


// ========================================
// SPEED +
// ========================================

async function increaseSpeed()
{
    if (speed < MAX_SPEED)
    {
        speed += SPEED_STEP;

        updateSpeedDisplay();

        await sendCommand(
            "V" + speed
        );
    }
}


// ========================================
// SPEED -
// ========================================

async function decreaseSpeed()
{
    if (speed > MIN_SPEED)
    {
        speed -= SPEED_STEP;

        updateSpeedDisplay();

        await sendCommand(
            "V" + speed
        );
    }
}
// ========================================
// RESET SPEED
// ========================================

async function resetSpeed()
{
    speed = 10;

    updateSpeedDisplay();

    await sendCommand("V10");
}

// ========================================
// UPDATE SPEED DISPLAY
// ========================================

function updateSpeedDisplay()
{
    document.getElementById("speed").innerHTML =
        speed + " mm/s";
}

</script>

</body>
</html>
